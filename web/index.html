<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capability Hub (MAF)</title>
<style>
:root{color-scheme:light dark;--bg:#f5f4f1;--card:#fff;--ink:#1b1b2a;--muted:#5f6272;--line:#dcdad3;--accent:#3b3fd8;--accent-t:#fff;--tint:#e9e9fb;--ok:#177a4a;--bad:#b3261e;--warn:#946200;--warn-bg:#fff1cc}
@media (prefers-color-scheme:dark){:root{--bg:#13141c;--card:#1c1e29;--ink:#ecedf5;--muted:#a3a6b8;--line:#2d3040;--accent:#8f93ff;--accent-t:#10112a;--tint:#262a52;--ok:#5fd195;--bad:#ff8f86;--warn:#f0c04a;--warn-bg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--tint);font-size:.78rem;font-weight:600}
select,input{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){main{grid-template-columns:1.4fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{font-size:1.05rem;margin:0 0 8px}
.muted{color:var(--muted);font-size:.9rem}
.banner{background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem}
#thread{min-height:260px;max-height:55vh;overflow:auto;padding:4px 2px}
.msg{margin:0 0 10px;display:flex}
.msg.user{justify-content:flex-end}
.bubble{padding:9px 13px;border-radius:14px;max-width:92%;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--accent);color:var(--accent-t)}
.msg.agent .bubble{background:var(--bg);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font:600 1rem system-ui;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inputrow{display:flex;gap:8px;margin-top:10px}
.inputrow input{flex:1;min-width:0}
.approval{border:1px solid var(--warn);background:var(--warn-bg);border-radius:12px;padding:10px 12px;margin:6px 0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 .92rem system-ui;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.item{border-top:1px solid var(--line);padding:8px 0;font-size:.92rem}
.item:first-child{border-top:0}
.s-ok,.o-Succeeded,.o-Approved,.o-Loaded,.o-Exposed{color:var(--ok);font-weight:700}
.s-bad,.o-Blocked,.o-Denied,.o-Failed,.o-Refused{color:var(--bad);font-weight:700}
.s-warn,.o-Status{color:var(--warn);font-weight:700}
#panel{max-height:60vh;overflow:auto}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stage{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:.85rem;font-weight:600}
.stage small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.stage.on{border-color:var(--ok);background:var(--tint)}
.stage.bad{border-color:var(--bad);background:var(--warn-bg)}
.stage.wait{border-color:var(--warn);background:var(--warn-bg)}
.arrow{color:var(--muted)}
.span2{grid-column:1/-1}
.hide{display:none}
</style>
</head>
<body>
<header><div class="bar">
  <div class="row"><span class="brand">Capability Hub</span><span class="chip" id="mode">…</span></div>
  <div class="row"><label for="user" class="muted">Signed in as</label><select id="user" aria-label="User"></select></div>
</div></header>

<main>
  <p class="banner span2" id="note"></p>
  <section class="card span2" aria-label="Request flow">
    <h2>How a request flows</h2>
    <div class="flow" id="flow"></div>
  </section>
  <section class="card" aria-label="Chat">
    <h2>Ask the agent</h2>
    <p class="muted" id="who"></p>
    <div id="thread" aria-live="polite"></div>
    <div class="row" id="sugg" style="margin-top:8px"></div>
    <div class="inputrow">
      <input id="msg" placeholder="Ask for something…" aria-label="Your request" autocomplete="off">
      <button class="btn" id="send">Send</button>
    </div>
  </section>

  <section class="card" aria-label="Details">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-steps" aria-selected="true">Steps</button>
      <button class="tab" role="tab" id="t-audit" aria-selected="false">Audit</button>
      <button class="tab" role="tab" id="t-reg" aria-selected="false">Registry</button>
    </div>
    <div id="panel"></div>
  </section>
</main>

<script>
function $(id){return document.getElementById(id)}
function h(tag,props){var e=document.createElement(tag);props=props||{};
  Object.keys(props).forEach(function(k){if(k==="class")e.className=props[k];else if(k==="text")e.textContent=props[k];else if(k.indexOf("on")===0)e[k]=props[k];else e.setAttribute(k,props[k])});
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.appendChild(typeof c==="string"?document.createTextNode(c):c)}return e}
async function api(path,body){
  var opt=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};
  var r=await fetch(path,opt);
  if(!r.ok){var t="";try{t=(await r.json()).detail}catch(e){}throw new Error(t||("Request failed: "+r.status))}
  return r.json()}

var STAGES=[["ask","Ask","your request"],["discover","Discover","search the registry"],["filter","Filter","status + permissions"],["approve","Approve","high-impact only"],["run","Run","function + MCP"],["audit","Audit","every decision logged"]];
function drawFlow(marks){var f=$("flow");f.innerHTML="";STAGES.forEach(function(st,i){
  if(i)f.appendChild(h("span",{class:"arrow",text:"→"}));
  f.appendChild(h("div",{class:"stage"+(marks&&marks[st[0]]?" "+marks[st[0]]:"")},st[1],h("small",{text:st[2]})))})}
var marks={};
function markFlow(steps,merge,waiting){var m={ask:"on"};
  if(steps&&steps.length){m.discover="on";m.audit="on";
    var out=steps.map(function(a){return String(a.outcome).split(" ")[0]});
    if(out.indexOf("Blocked")>-1||out.indexOf("No")>-1)m.filter="bad";else if(out.indexOf("Loaded")>-1)m.filter="on";
    if(out.indexOf("Approved")>-1||out.indexOf("Denied")>-1)m.approve=out.indexOf("Denied")>-1?"bad":"on";
    if(out.indexOf("Succeeded")>-1||out.indexOf("Failed")>-1)m.run=out.indexOf("Failed")>-1?"bad":"on"}
  if(waiting)m.approve="wait";
  if(merge)m=Object.assign({},marks,m);
  marks=m;drawFlow(m)}
var info=null,sid=Math.random().toString(36).slice(2),tab="steps",lastSteps=[];

function user(){return info.users.filter(function(u){return u.id===$("user").value})[0]}
function newSession(){sid=Math.random().toString(36).slice(2);$("thread").innerHTML="";lastSteps=[];marks={};drawFlow();
  $("who").textContent=user().admin?"You are a registry admin. Open the Registry tab to disable or enable capabilities.":"Your groups: "+user().groups.join(", ")+". The agent can only use capabilities your groups allow.";
  renderPanel()}

function bubble(who,text){var m=h("div",{class:"msg "+who},h("div",{class:"bubble",text:text}));$("thread").appendChild(m);$("thread").scrollTop=$("thread").scrollHeight;return m}

function showResult(res,merge){
  bubble("agent",res.reply);
  lastSteps=res.steps||[];markFlow(lastSteps,merge,(res.pending||[]).length>0);
  (res.pending||[]).forEach(function(p){
    var args=typeof p.arguments==="string"?p.arguments:JSON.stringify(p.arguments);
    var box=h("div",{class:"approval"},h("b",{text:"Approval needed: "+p.name}),h("div",{class:"muted",text:"Arguments: "+args}));
    var row=h("div",{class:"row"});row.style.marginTop="6px";
    function decide(ok){return async function(){
      box.querySelectorAll("button").forEach(function(b){b.disabled=true});
      try{var r=await api("/api/approve",{session_id:sid,approval_id:p.id,approved:ok});box.remove();showResult(r,true)}catch(e){box.appendChild(h("div",{class:"s-bad",text:e.message}))}}}
    row.appendChild(h("button",{class:"btn sm",text:"Approve",onclick:decide(true)}));
    row.appendChild(h("button",{class:"btn ghost sm",text:"Deny",onclick:decide(false)}));
    box.appendChild(row);$("thread").appendChild(box);$("thread").scrollTop=$("thread").scrollHeight});
  renderPanel()}

async function send(){
  var text=$("msg").value.trim();if(!text)return;
  $("msg").value="";$("send").disabled=true;bubble("user",text);
  var wait=bubble("agent","Working…");
  try{var res=await api("/api/chat",{session_id:sid,user:$("user").value,message:text});wait.remove();showResult(res)}
  catch(e){wait.remove();bubble("agent","Error: "+e.message)}
  $("send").disabled=false;$("msg").focus()}

function stepRow(a){return h("div",{class:"item"},h("b",{text:(a.capability||"")+" "}),h("span",{class:"o-"+String(a.outcome).split(" ")[0],text:a.outcome}),h("div",{class:"muted",text:(a.user?a.user+" · ":"")+(a.time||"")+(a.detail?" · "+a.detail:"")}))}

async function renderPanel(){
  ["steps","audit","reg"].forEach(function(t){$("t-"+t).setAttribute("aria-selected",t===tab?"true":"false")});
  var p=$("panel");p.innerHTML="";
  try{
    if(tab==="steps"){
      if(!lastSteps.length){p.appendChild(h("div",{class:"muted",text:"Ask something to see how the agent decided: discovery, blocked tools, approvals and results."}))}
      lastSteps.forEach(function(a){p.appendChild(stepRow(a))})}
    else if(tab==="audit"){
      var rows=await api("/api/audit");
      if(!rows.length)p.appendChild(h("div",{class:"muted",text:"The audit log is empty."}));
      rows.forEach(function(a){p.appendChild(stepRow(a))})}
    else{
      var caps=await api("/api/registry?user="+encodeURIComponent($("user").value));
      var admin=user().admin;
      caps.forEach(function(c){
        var top=h("div",{class:"row"},h("b",{text:c.name}),h("span",{class:"chip",text:c.type}),
          h("span",{class:c.status==="active"?"s-ok":(c.status==="disabled"?"s-bad":"s-warn"),text:c.status}));
        if(c.requires_approval)top.appendChild(h("span",{class:"chip",text:"needs approval"}));
        var d=h("div",{class:"item"},top,h("div",{class:"muted",text:c.description}),
          h("div",{class:"muted",text:"Groups: "+c.groups.join(", ")+" · v"+c.version+" · "+(c.usable?"you can use this":"not available to you")}));
        if(admin){
          var s=h("select",{"aria-label":"Status of "+c.name});
          ["active","disabled","deprecated"].forEach(function(o){var op=h("option",{value:o,text:o});if(o===c.status)op.selected=true;s.appendChild(op)});
          s.onchange=async function(){try{await api("/api/registry/status",{user:$("user").value,name:c.name,status:s.value});renderPanel()}catch(e){alert(e.message)}};
          var r=h("div",{class:"row"},s);r.style.marginTop="6px";d.appendChild(r)}
        p.appendChild(d)})}
  }catch(e){p.appendChild(h("div",{class:"s-bad",text:e.message}))}}

["steps","audit","reg"].forEach(function(t){$("t-"+t).onclick=function(){tab=t;renderPanel()}});
$("send").onclick=send;$("msg").onkeydown=function(e){if(e.key==="Enter")send()};
$("user").onchange=newSession;

(async function init(){
  info=await api("/api/info");
  info.users.forEach(function(u){$("user").appendChild(h("option",{value:u.id,text:u.name}))});
  $("mode").textContent=info.mode==="offline"?"Offline demo (no model)":"Model: "+info.mode;
  $("note").textContent=info.mode==="offline"
    ?"Offline demo: keyword search stands in for the model. The registry, permissions, approval, MCP calls and audit log are the real project code. Results from function tools are simulated."
    :"A real model decides which capabilities to load. Function tool results are simulated. The user dropdown is a demo, not real sign-in.";
  [["Find the latest incident and open tickets"],["Restart the stuck server"],["Show the sales revenue report"],["Any security alerts?"],["Find the leave policy"]].forEach(function(s){
    $("sugg").appendChild(h("button",{class:"btn ghost sm",text:s[0],onclick:function(){$("msg").value=s[0];send()}}))});
  newSession()})();
</script>
</body>
</html>
